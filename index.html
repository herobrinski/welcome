<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: "Bahnschrift", "Barlow", "DIN Alternate", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 52px;
      position: relative;
    }

    .download {
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(414px, 80vw);
      height: 148px;
      border: 5px solid #fff;
      color: #fff;
      text-decoration: none;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
    }

    .download:hover,
    .download:focus-visible {
      background: #fff;
      color: #000;
      outline: none;
    }

    .hint {
      position: absolute;
      left: 4px;
      bottom: 6px;
      font-size: clamp(24px, 3.6vw, 42px);
    }
  </style>
</head>
<body>
  <!-- Положите файл карты рядом с index.html и назовите его map.bsp
       (или измените имя в href ниже) -->
  <a class="download" href="map.bsp" download>Download</a>

  <p class="hint">put bsp file in map folder</p>
</body>
</html>
